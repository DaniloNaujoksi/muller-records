    - generic [ref=f1e391]:
      - paragraph [ref=f1e392]:
        - generic [ref=f1e393]: "03"
        - generic [ref=f1e395]: History
      - blockquote [ref=f1e396]: Started in a Berlin that was still deciding what it was going to be.
      - generic [ref=f1e397]:
        - paragraph [ref=f1e398]: Frank Müller moved to Berlin in 1992, a trained mechanical engineer who had been DJing since the mid-eighties. Acid Orange followed in 1993 and ran twenty records deep, including Toktok's debut single. Müller Records opened in 1996.
        - paragraph [ref=f1e399]: "What followed was thirty years of records that refused to pick a lane: Detroit techno, acid, new wave melody, and a permanent open line to Tokyo, where Beroshima plays to rooms most European producers never see."
      - link "The full story" [ref=f1e401] [cursor=pointer]:
        - /url: /history
