        - generic [ref=f1e213]:
          - heading "Who has released here" [level=2] [ref=f1e214]
          - link "All artists" [ref=f1e215] [cursor=pointer]:
            - /url: /artists
        - paragraph [ref=f1e219]: Detroit, Tokyo, Grenoble, New York, Berlin. The label never had a house sound so much as a standard — records that work at 3am and still hold up on headphones the next afternoon.
        - list [ref=f1e221]:
          - listitem [ref=f1e222]:
            - heading "Claude Young" [level=3] [ref=f1e224]
            - generic [ref=f1e225]:
              - paragraph [ref=f1e226]: Detroit second wave, one of the fastest hands to ever touch three decks.
              - paragraph [ref=f1e227]: Detroit
          - listitem [ref=f1e228]:
            - heading "The Hacker" [level=3] [ref=f1e230]
            - generic [ref=f1e231]:
              - paragraph [ref=f1e232]: The electro-body axis of French techno.
              - paragraph [ref=f1e233]: Grenoble
          - listitem [ref=f1e234]:
            - heading "John Selway" [level=3] [ref=f1e236]
            - generic [ref=f1e237]:
              - paragraph [ref=f1e238]: New York techno, Disturbance and Sync Research.
              - paragraph [ref=f1e239]: New York
          - listitem [ref=f1e240]:
            - heading "Ken Ishii" [level=3] [ref=f1e242]
            - generic [ref=f1e243]:
              - paragraph [ref=f1e244]: The producer who put Japanese techno on the world map.
              - paragraph [ref=f1e245]: Tokyo
          - listitem [ref=f1e246]:
            - heading "Takkyu Ishino" [level=3] [ref=f1e248]
            - generic [ref=f1e249]:
              - paragraph [ref=f1e250]: Denki Groove. Shared the Matadors Of Techno record with Beroshima.
              - paragraph [ref=f1e251]: Tokyo
          - listitem [ref=f1e252]:
            - heading "Westbam" [level=3] [ref=f1e254]
            - generic [ref=f1e255]:
              - paragraph [ref=f1e256]: Low Spirit, Mayday, and half of what German techno means in public.
              - paragraph [ref=f1e257]: Berlin
          - listitem [ref=f1e258]:
            - heading "Air Liquide" [level=3] [ref=f1e260]
            - generic [ref=f1e261]:
              - paragraph [ref=f1e262]: Ingmar Koch and Cem Oral. The acid end of German electronics.
              - paragraph [ref=f1e263]: Cologne / Frankfurt
          - listitem [ref=f1e264]:
            - heading "Ulrich Schnauss" [level=3] [ref=f1e266]
            - generic [ref=f1e267]:
              - paragraph [ref=f1e268]: Shoegaze in synth form. Recurring collaborator across the catalogue.
              - paragraph [ref=f1e269]: Berlin
