    - generic [ref=e391]:
      - paragraph [ref=e392]:
        - generic [ref=e393]: "03"
        - generic [ref=e395]: Geschichte
      - blockquote [ref=e396]: Angefangen in einem Berlin, das noch nicht entschieden hatte, was es werden will.
      - generic [ref=e397]:
        - paragraph [ref=e398]: Frank Müller zieht 1992 nach Berlin — gelernter Maschinenbauer, seit Mitte der Achtziger als DJ unterwegs. 1993 folgt Acid Orange, zwanzig Platten tief, darunter die Debütsingle von Toktok. 1996 öffnet Müller Records.
        - paragraph [ref=e399]: "Danach dreißig Jahre Platten, die sich nie auf eine Spur festlegen ließen: Detroit-Techno, Acid, New-Wave-Melodik — und eine dauerhaft offene Leitung nach Tokio, wo Beroshima vor Räumen spielt, die die meisten europäischen Produzenten nie sehen."
      - link "Die ganze Geschichte" [ref=e401] [cursor=pointer]:
        - /url: /de/geschichte
    - generic [ref=e407]:
