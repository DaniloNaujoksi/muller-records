    - generic [ref=e207]:
      - paragraph [ref=e208]:
        - generic [ref=e209]: "01"
        - generic [ref=e211]: Roster
      - generic [ref=e212]:
        - generic [ref=e213]:
          - heading "Wer hier veröffentlicht hat" [level=2] [ref=e214]
          - link "Alle Artists" [ref=e215] [cursor=pointer]:
            - /url: /de/artists
        - paragraph [ref=e219]: Detroit, Tokio, Grenoble, New York, Berlin. Das Label hatte nie einen House-Sound, sondern einen Maßstab — Platten, die um drei Uhr nachts funktionieren und am Nachmittag danach über Kopfhörer immer noch stehen.
        - list [ref=e221]:
          - listitem [ref=e222]:
            - heading "Claude Young" [level=3] [ref=e224]
            - generic [ref=e225]:
              - paragraph [ref=e226]: Detroit second wave, one of the fastest hands to ever touch three decks.
              - paragraph [ref=e227]: Detroit
          - listitem [ref=e228]:
            - heading "The Hacker" [level=3] [ref=e230]
            - generic [ref=e231]:
              - paragraph [ref=e232]: The electro-body axis of French techno.
              - paragraph [ref=e233]: Grenoble
          - listitem [ref=e234]:
            - heading "John Selway" [level=3] [ref=e236]
            - generic [ref=e237]:
              - paragraph [ref=e238]: New York techno, Disturbance and Sync Research.
              - paragraph [ref=e239]: New York
          - listitem [ref=e240]:
            - heading "Ken Ishii" [level=3] [ref=e242]
            - generic [ref=e243]:
              - paragraph [ref=e244]: The producer who put Japanese techno on the world map.
              - paragraph [ref=e245]: Tokyo
          - listitem [ref=e246]:
            - heading "Takkyu Ishino" [level=3] [ref=e248]
            - generic [ref=e249]:
              - paragraph [ref=e250]: Denki Groove. Shared the Matadors Of Techno record with Beroshima.
              - paragraph [ref=e251]: Tokyo
          - listitem [ref=e252]:
            - heading "Westbam" [level=3] [ref=e254]
            - generic [ref=e255]:
              - paragraph [ref=e256]: Low Spirit, Mayday, and half of what German techno means in public.
              - paragraph [ref=e257]: Berlin
          - listitem [ref=e258]:
            - heading "Air Liquide" [level=3] [ref=e260]
            - generic [ref=e261]:
              - paragraph [ref=e262]: Ingmar Koch and Cem Oral. The acid end of German electronics.
              - paragraph [ref=e263]: Cologne / Frankfurt
          - listitem [ref=e264]:
            - heading "Ulrich Schnauss" [level=3] [ref=e266]
            - generic [ref=e267]:
              - paragraph [ref=e268]: Shoegaze in synth form. Recurring collaborator across the catalogue.
              - paragraph [ref=e269]: Berlin
