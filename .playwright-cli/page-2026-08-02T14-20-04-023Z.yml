        - generic [ref=e411]: Merch
      - heading "Das Zeichen auf Baumwolle" [level=2] [ref=e412]
      - paragraph [ref=e413]: Das Logo hat die meisten Clubs überlebt, in denen es lief. Shirts, Hoodies, Slipmats und Platten-Bundles — um das Zeichen herum gebaut, nicht darübergedruckt.
